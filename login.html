<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Login to GeoFix - Access your civic complaint dashboard">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Login - GeoFix</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/install-app.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-wrapper">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 00-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                    </svg>
                    <h1>GeoFix</h1>
                </div>
                <h2>Welcome Back!</h2>
                <p>Login to continue reporting civic issues</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="link-text">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Login</button>

                <div class="form-divider">
                    <span>OR</span>
                </div>

                <div class="auth-links">
                    <p>Don't have an account? <a href="register.html">Create one now</a></p>
                    <p><a href="index.html">← Back to Home</a></p>
                </div>

                
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Simple mobile scroll fix
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        document.documentElement.style.height = '';
        document.body.style.height = '';
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW registration failed'));
        }
        
        // Copy protection (desktop only, allow mobile interaction)
        if (!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.addEventListener('contextmenu', (e) => { if (!e.target.matches('input, textarea, a')) e.preventDefault(); });
            document.addEventListener('copy', (e) => { if (!e.target.matches('input, textarea')) e.preventDefault(); });
            document.addEventListener('cut', (e) => { if (!e.target.matches('input, textarea')) e.preventDefault(); });
        }
        document.addEventListener('keydown', (e) => {
            if (!e.target.matches('input, textarea') && ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'x' || e.key === 'a' || e.key === 'u' || e.key === 's'))) e.preventDefault();
        });
    </script>
</body>
</html>
